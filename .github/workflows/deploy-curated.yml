name: Publish curated content

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - public/generated-curated.json
      - admin.html
      - static-admin-main.tsx
      - app/admin/curated-admin.tsx
      - app/infohub-app.tsx
      - app/globals.css
      - vite.static.config.ts
  workflow_dispatch:

concurrency:
  group: infohub-publisher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
