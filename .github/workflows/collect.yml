name: Collect InfoHub sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: infohub-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install transcript fallback
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Prepare YouTube transcript skill
        run: git clone --depth 1 https://github.com/jimliu/baoyu-skills.git "$RUNNER_TEMP/baoyu-skills"

      - name: Collect and publish
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: https://api.moonshot.cn/v1
          MOONSHOT_MODEL: kimi-k2.6
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          INFOHUB_BASE_URL: ${{ secrets.INFOHUB_BASE_URL }}
          BAOYU_TRANSCRIPT_SCRIPT: ${{ runner.temp }}/baoyu-skills/skills/baoyu-youtube-transcript/scripts/main.ts
        run: npm run collect

      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: outputs/last-collection.json
          if-no-files-found: ignore
          retention-days: 14
