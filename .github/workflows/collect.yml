name: Collect InfoHub sources

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      source:
        description: "只重跑一个来源；all 表示完整运行"
        required: true
        default: all
        type: choice
        options:
          - all
          - follow-builders
          - technical-x
          - papers
          - github
          - summaries
          - publish-only
  schedule:
    # UTC 17:17 = 北京时间次日 01:17；避开整点高峰，并为 10:00 前发布预留充足缓冲。
    - cron: "17 17 * * *"

concurrency:
  group: infohub-publisher
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect and publish
        if: inputs.source != 'publish-only'
        id: collect_step
        continue-on-error: true
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MOONSHOT_BASE_URL: https://api.kimi.com/coding/v1
          MOONSHOT_MODEL: k3-256k
        run: |
          if [ "${{ inputs.source }}" = "summaries" ]; then
            npm run summaries
          elif [ -n "${{ inputs.source }}" ] && [ "${{ inputs.source }}" != "all" ]; then
            npm run collect -- --source="${{ inputs.source }}"
          else
            npm run collect:reliable
          fi

      - name: Save new public content
        if: inputs.source != 'publish-only'
        run: npm run archive:daily

      - name: Commit new public content
        if: inputs.source != 'publish-only'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/generated-feed.json app/generated-section-summaries.json app/generated-run-summary.json public/archive/daily
          if ! git diff --cached --quiet; then
            git commit -m "content: update daily digest"
            git push
          fi

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Publish GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keep collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: |
            outputs/last-collection*.json
            outputs/collection-status.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark unresolved collection errors
        if: always() && steps.collect_step.outcome == 'failure'
        run: |
          echo "采集结果已尽可能发布，但仍有来源或总结在重试后失败。请查看 collection-report。"
          exit 1
